### font
    # no italics: a bare family still picks the slanted face, hence style=
    font_family             family="Monaspace Neon NF" style=Regular
    bold_font               family="Monaspace Neon NF" style=Bold
    italic_font             family="Monaspace Neon NF" style=Regular
    bold_italic_font        family="Monaspace Neon NF" style=Bold
    font_size               12

### window
    hide_window_decorations yes
    background_opacity      0.88

### cursor
    # fish's vi mode sets the shape
    cursor_shape            block
    cursor_blink_interval   0
    shell_integration       no-cursor

### colours
    # bubblegum, inverted: the darkest shade behind
    foreground              #feedf3
    background              #352930
    cursor                  #f030a8
    selection_foreground    #feedf3
    selection_background    #745268
    url_color               #00b9a3

    # tabs and splits, which were kitty's grey and green
    active_tab_foreground   #feedf3
    active_tab_background   #745268
    inactive_tab_foreground #e0ccd1
    inactive_tab_background #463840
    active_border_color     #f030a8
    inactive_border_color   #745268
    bell_border_color       #d79921

